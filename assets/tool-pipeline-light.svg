<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="650"><stop stop-color="#F5F9FF"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2FBF8"/></linearGradient><filter id="sh3" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="9" stdDeviation="11" flood-color="#315A9A" flood-opacity=".11"/></filter><style>.h3{font:800 32px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#172642}.k3{font:800 11px Consolas,monospace;fill:#2563EB}.t3{font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#172642}.p3{font:500 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#63718A}.c3{font:600 11px Consolas,monospace;fill:#47617F}.yes{font:700 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#0E9F79}.no{font:700 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#E66856}</style></defs>
  <rect width="1200" height="650" rx="32" fill="url(#bg3)"/><text x="60" y="69" class="k3">GUARDED TOOL EXECUTION</text><text x="60" y="111" class="h3">工具执行不是一次函数调用，而是一条结算管线</text><text x="60" y="142" class="p3">每个出口——成功、拒绝、取消、超时、异常——都要生成模型可消费且可审计的最终结果。</text>
  <path d="M114 280H1082" stroke="#BDD0E9" stroke-width="3"/><path d="M1065 269L1082 280L1065 291" stroke="#BDD0E9" stroke-width="3"/>
  <g filter="url(#sh3)"><rect x="45" y="211" width="136" height="138" rx="18" fill="white" stroke="#CFDDF0"/><text x="65" y="242" class="k3">01 · PRE</text><text x="65" y="278" class="t3">解析与改写</text><text x="65" y="305" class="c3">args → intent</text><text x="65" y="328" class="p3">schema / hooks</text></g>
  <g filter="url(#sh3)"><rect x="204" y="211" width="136" height="138" rx="18" fill="white" stroke="#F0C9C2"/><text x="224" y="242" class="k3" fill="#E66856">02 · APPROVE</text><text x="224" y="278" class="t3">用户审批</text><text x="224" y="305" class="c3">allow / deny</text><text x="224" y="328" class="p3">preset + prompt</text></g>
  <g filter="url(#sh3)"><rect x="363" y="211" width="136" height="138" rx="18" fill="white" stroke="#F0C9C2"/><text x="383" y="242" class="k3" fill="#E66856">03 · GUARD</text><text x="383" y="278" class="t3">单调收紧</text><text x="383" y="305" class="c3">allow → deny</text><text x="383" y="328" class="p3">never re-allow</text></g>
  <g filter="url(#sh3)"><rect x="522" y="211" width="136" height="138" rx="18" fill="#2563EB"/><text x="542" y="242" class="k3" fill="#DCEAFF">04 · AROUND</text><text x="542" y="278" style="font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:white">真实执行</text><text x="542" y="305" style="font:600 11px Consolas,monospace;fill:#DCEAFF">signal / scope</text><text x="542" y="328" style="font:500 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#DCEAFF">sandbox world</text></g>
  <g filter="url(#sh3)"><rect x="681" y="211" width="136" height="138" rx="18" fill="white" stroke="#CFDDF0"/><text x="701" y="242" class="k3">05 · POST</text><text x="701" y="278" class="t3">结果处理</text><text x="701" y="305" class="c3">observe / redact</text><text x="701" y="328" class="p3">telemetry / policy</text></g>
  <g filter="url(#sh3)"><rect x="840" y="211" width="136" height="138" rx="18" fill="white" stroke="#CFDDF0"/><text x="860" y="242" class="k3">06 · NORMALIZE</text><text x="860" y="278" class="t3">统一语义</text><text x="860" y="305" class="c3">content / error</text><text x="860" y="328" class="p3">provider-neutral</text></g>
  <g filter="url(#sh3)"><rect x="999" y="211" width="156" height="138" rx="18" fill="white" stroke="#BDE2D5"/><text x="1019" y="242" class="k3" fill="#0E9F79">07 · FINALIZE</text><text x="1019" y="278" class="t3">结清工具债务</text><text x="1019" y="305" class="c3">frozen result</text><text x="1019" y="328" class="p3">append fact</text></g>
  <path d="M272 368V426H1077V368" stroke="#E66856" stroke-width="2" stroke-dasharray="6 6"/><path d="M431 368V426M590 368V426M749 368V426M908 368V426" stroke="#E66856" stroke-width="2" stroke-dasharray="6 6"/><rect x="170" y="410" width="890" height="76" rx="18" fill="#FFF4F1" stroke="#F2C8C0"/><text x="196" y="441" class="no">DENY · THROW · CANCEL · TIMEOUT</text><text x="196" y="466" class="p3">不能旁路到空响应；全部汇入 normalize → finalize，生成匹配 toolCallId 的可消费结果。</text><path d="M1060 448H1091V349" stroke="#E66856" stroke-width="2"/><path d="M1080 365L1091 349L1102 365" stroke="#E66856" stroke-width="2"/>
  <rect x="60" y="535" width="1080" height="62" rx="16" fill="#EAF9F3" stroke="#BDE2D5"/><text x="83" y="561" class="yes">MONOTONIC SAFETY</text><text x="83" y="581" class="p3">下游 Guard 可以继续收紧权限，但不能把上游已经拒绝的操作重新放行。</text>
</svg>
