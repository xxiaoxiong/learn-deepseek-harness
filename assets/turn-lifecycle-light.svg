  <rect x="60" y="542" width="1080" height="1" fill="#D7E1EF"/><text x="60" y="577" class="p">INVARIANT</text><text x="145" y="577" class="t">工具调用与工具结果必须配对；实时 agent/* 不能替代持久 SessionEvent。</text>
