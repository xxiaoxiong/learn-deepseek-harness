  <g filter="url(#s)"><rect x="56" y="210" width="152" height="148" rx="20" fill="white" stroke="#CAD9EE"/><circle cx="88" cy="242" r="16" fill="#EAF3FF"/><text x="88" y="247" text-anchor="middle" class="k">01</text><text x="78" y="281" class="t">Claim input</text><text x="78" y="309" class="c">inbox/claim</text><text x="78" y="333" class="p">唯一消费权</text></g>
  <g filter="url(#s)"><rect x="232" y="210" width="152" height="148" rx="20" fill="white" stroke="#CAD9EE"/><circle cx="264" cy="242" r="16" fill="#EAF3FF"/><text x="264" y="247" text-anchor="middle" class="k">02</text><text x="254" y="281" class="t">Open turn</text><text x="254" y="309" class="c">turn/start</text><text x="254" y="333" class="p">开启结算单元</text></g>
  <g filter="url(#s)"><rect x="408" y="210" width="176" height="148" rx="20" fill="#2563EB"/><circle cx="440" cy="242" r="16" fill="#5D8FF4"/><text x="440" y="247" text-anchor="middle" class="wt">03</text><text x="430" y="281" class="wt">Freeze request</text><text x="430" y="309" class="wp">request/header</text><text x="430" y="333" class="wp">完整 Epoch 快照</text></g>
  <g filter="url(#s)"><rect x="608" y="210" width="152" height="148" rx="20" fill="white" stroke="#CAD9EE"/><circle cx="640" cy="242" r="16" fill="#E9FAF3"/><text x="640" y="247" text-anchor="middle" class="k">04</text><text x="630" y="281" class="t">LLM step</text><text x="630" y="309" class="c">step/start</text><text x="630" y="333" class="p">stream response</text></g>
  <g filter="url(#s)"><rect x="784" y="210" width="152" height="148" rx="20" fill="white" stroke="#CAD9EE"/><circle cx="816" cy="242" r="16" fill="#FFF0ED"/><text x="816" y="247" text-anchor="middle" class="k">05</text><text x="806" y="281" class="t">Tool debt</text><text x="806" y="309" class="c">tool/pipeline</text><text x="806" y="333" class="p">结果必须配对</text></g>
  <g filter="url(#s)"><rect x="960" y="210" width="184" height="148" rx="20" fill="white" stroke="#CAD9EE"/><circle cx="992" cy="242" r="16" fill="#F2EDFF"/><text x="992" y="247" text-anchor="middle" class="k">06</text><text x="982" y="281" class="t">Settle turn</text><text x="982" y="309" class="c">turn/finish</text><text x="982" y="333" class="p">状态 / 用量 / 错误</text></g>
