<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="b" x1="0" y1="0" x2="1200" y2="620"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#F0FBF7"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="10" stdDeviation="12" flood-color="#315A9A" flood-opacity=".12"/></filter><style>.h{font:800 32px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#172642}.k{font:800 12px Consolas,monospace;fill:#2563EB}.t{font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#182944}.p{font:500 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#60718B}.c{font:600 11px Consolas,monospace;fill:#37629D}.w{fill:white}.wt{font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:white}.wp{font:500 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#D9E8FF}</style></defs>
  <rect width="1200" height="620" rx="32" fill="url(#b)"/><text x="60" y="70" class="k">TURN / STEP · SETTLEMENT MODEL</text><text x="60" y="112" class="h">一次回答，可能经过多次模型请求</text><text x="60" y="142" class="p">Turn 认领一条输入并结清所有工具债务；Step 只代表一次 LLM request / stream。</text>
